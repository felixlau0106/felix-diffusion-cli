[project]
name = "felix-diffusion-cli"
version = "0.1.0"
description = "Felix' application for running SDXL/Illustrious models."
readme = "README.md"
authors = [
    { name = "felixlau0106", email = "133904761+felixlau0106@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.27.0",
    "basicsr",
    "compel>=2.2.0",
    "depth-anything-3",
    "diffusers>=0.27.0,<0.32.0",
    "huggingface-hub>=0.21.0",
    "numpy",
    "opencv-python",
    "peft>=0.9.0",
    "pillow>=12.3.0",
    "protobuf>=7.36.1",
    "realesrgan",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.2",
    "torch>=2.2.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "transformers>=4.38.0,<5.0.0",
    "triton>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3.git" }
